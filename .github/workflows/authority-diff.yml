name: Authority Diff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  authority-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Compare effective authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node dist/cli/scan.js diff "${BASE_SHA}..${HEAD_SHA}" --markdown > scopegraph-summary.md
          status=$?
          cat scopegraph-summary.md
          cat scopegraph-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
